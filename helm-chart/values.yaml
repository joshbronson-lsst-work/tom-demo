# Default values for tom-demo.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

djangoDebug: true

gunicornWorkers: 2
gunicornTimeout: 300

replicaCount: 1

image:
  repository: "docker.lco.global/tom-demo"
  tag: stable
  pullPolicy: IfNotPresent

csrf_trusted_origins: []

# Automatic certificate management via cert-manager
# Set enabled=true and provide issuer details to have cert-manager
# obtain and renew Let's Encrypt certificates for your ingress host(s).
certManager:
  enabled: false
  # One of: ClusterIssuer or Issuer
  issuerKind: ClusterIssuer
  # Name of the (Cluster)Issuer resource to use
  issuerName: letsencrypt-prod
  # ACME account email
  email: admin@example.com
  # ACME directory URL (use staging for initial tests)
  acmeServer: https://acme-v02.api.letsencrypt.org/directory
  # HTTP-01 solver configuration
  http01:
    # Ingress class used by your NGINX controller
    ingressClass: nginx-ingress-private
  # TLS secret to be managed by cert-manager; if empty, defaults to
  # "<fullname>-tls". You may also continue supplying
  # ingress.tls[0].secretName to control it explicitly.
  tlsSecretName: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# see https://helm.sh/docs/chart_best_practices/rbac/#rbac-resources-should-be-created-by-default
rbac:
  # Specifies whether Role-Based Access Control (RBAC) resources should be created
  create: true

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name:

podSecurityContext:
  fsGroup: 1000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  annotations: {}
    # kubernetes.io/ingress.global-static-ip-name: tom-static-ip
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths: []

  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# Settings for the PostgreSQL database
applyDatabaseMigrations: true
useDockerizedDatabase: true

djangoDatabaseEngine: "django.db.backends.postgresql"
postgresql:
  # updated according to bitnami-packaged postgresql helm chart
  # see helm-chart/requirements.yaml and documentation for that chart
  auth:
    postgresPassword: "changeme"
    username: "postgres"
    password: "changeme"
    database: "postgres"
  primary:
    initdb:
      scripts:
        init_postgis.sh: |
          #!/bin/sh
          PGPASSWORD=$POSTGRES_PASSWORD psql -U postgres -c "create extension if not exists postgis;"
    service:
      port:
        postgresql: "5432"
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 400m
        memory: 512Mi

secretKey: "changeme"

loadInitialData:
  enabled: false

nodeSelector: {}

tolerations: []

affinity: {}
